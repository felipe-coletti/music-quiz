<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quiz de Música</title>
		<link rel="stylesheet" href="src/styles/global.css" />
		<script type="module" src="src/scripts/app.js" defer></script>
    </head>
    <body>
        <main id="main">
            <div id="container">
                <div id="title-area">
                    <h1 class="title-small title">Quiz de Música</h1>
                    <p class="paragraph">Pergunta <span id="question-counter">0/0</span></p>
                </div>
                <progress id="progress-bar" value="0" max="10"></progress>
                <form id="form">
                    <h2 id="question" class="title-medium title">Carregando pergunta...</h2>
                    <div id="options"></div>
                    <button type="submit" id="primary-button" class="button">Verificar</button>
                </form>
                <p id="feedback" class="paragraph" aria-live="polite" hidden></p>
            </div>
        </main>
    </body>
</html>
